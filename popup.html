<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #0b0914;
      --panel: rgba(25, 20, 48, 0.8);
      --gold: #ffaa00;
      --gem: #bf40ff;
      --cash: #00ff88;
      
      /* Hex values matching your custom image profiles */
      --color-basic: #9ba1b0;
      --color-uncommon: #2ecc71;
      --color-rare: #0088ff;
      --color-mythic: #a832ff;
      --color-legendary: #ffd700;
      --color-divine: #00ffff;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      width: 350px;
      box-sizing: border-box;
      padding: 16px;
      margin: 0;
      background: radial-gradient(circle at top, #1c153f 0%, var(--bg) 85%);
      color: #ffffff;
      overflow-x: hidden;
      overflow-y: auto;
    }
    h3 {
      margin: 0 0 14px 0;
      text-align: center;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 8px var(--color-divine);
    }
    .dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 6px;
      padding: 8px 4px;
      text-align: center;
    }
    .stat-lbl { font-size: 8px; color: #8c88af; text-transform: uppercase; margin-bottom: 2px; }
    .stat-val { font-size: 13px; font-weight: 800; font-family: monospace; }
    #coins-val { color: var(--gold); }
    #gems-val { color: var(--gem); }
    #bal-val { color: var(--cash); }

    .wheel-container {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 14px auto;
    }
    canvas#wheel {
      display: block;
      border: 4px solid #231b4d;
      border-radius: 50%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .wheel-ticker {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 16px solid var(--color-mythic);
      z-index: 10;
    }
    button#spin-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--color-mythic) 0%, #6312b3 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(168,50,255,0.25);
      margin-bottom: 14px;
    }
    button#spin-btn:disabled { background: #231d3d; color: #575275; box-shadow: none; cursor: not-allowed; }

    .inventory-section {
      background: var(--panel);
      border-radius: 8px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.03);
    }
    .inv-title { font-size: 10px; text-transform: uppercase; color: #8c88af; margin-bottom: 8px; font-weight: bold; letter-spacing: 1px; }
    
    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .item-row:last-child { border-bottom: none; }
    
    .item-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    /* Vector Asset Frame Rendering Setup */
    .potion-asset {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #15112e;
      border: 1px solid currentColor;
      font-size: 15px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
    }

    .item-name { font-size: 11px; font-weight: bold; }
    .item-controls { display: flex; align-items: center; gap: 8px; }
    .item-qty { font-size: 11px; font-family: monospace; font-weight: bold; color: #fff; width: 14px; text-align: center; }
    
    .btn-action {
      padding: 4px 8px;
      font-size: 9px;
      background: #15112e;
      border: 1px solid #332963;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: bold;
    }
    .btn-action:hover { background: #1f1945; }
    .item-row.active .item-name { text-shadow: 0 0 5px currentColor; }
    .item-row.active .btn-action { background: var(--color-mythic); border-color: var(--color-mythic); }

    #ticker-tray {
      margin-top: 10px;
      text-align: center;
      font-size: 10px;
      color: #8c88af;
      font-weight: 500;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <h3>Arcane Realm RNG</h3>
  
  <div class="dashboard">
    <div class="stat-card"><div class="stat-lbl">Coins</div><div class="stat-val" id="coins-val">50</div></div>
    <div class="stat-card"><div class="stat-lbl">Gems</div><div class="stat-val" id="gems-val">0</div></div>
    <div class="stat-card"><div class="stat-lbl">Balance</div><div class="stat-val" id="bal-val">$0.00</div></div>
  </div>

  <div class="wheel-container">
    <div class="wheel-ticker"></div>
    <canvas id="wheel" width="200" height="200"></canvas>
  </div>

  <button id="spin-btn">Invoke Fate Roll</button>

  <div class="inventory-section">
    <div class="inv-title">Alchemical Potion Inventory</div>
    
    <!-- Tier 6: Divine -->
    <div class="item-row" id="row-divine">
      <div class="item-meta">
        <span class="potion-asset" aria-hidden="true">✦</span>
        <div class="item-name" style="color:var(--color-divine);">Divine Potion</div>
      </div>
      <div class="item-controls">
        <div class="item-qty" id="qty-divine">0</div>
        <button class="btn-action" id="btn-divine">Arm</button>
      </div>
    </div>

    <!-- Tier 5: Legendary -->
    <div class="item-row" id="row-legendary">
      <div class="item-meta">
        <span class="potion-asset" aria-hidden="true">★</span>
        <div class="item-name" style="color:var(--color-legendary);">Legendary Potion</div>
      </div>
      <div class="item-controls">
        <div class="item-qty" id="qty-legendary">0</div>
        <button class="btn-action" id="btn-legendary">Arm</button>
      </div>
    </div>

    <!-- Tier 4: Mythic -->
    <div class="item-row" id="row-mythic">
      <div class="item-meta">
        <span class="potion-asset" aria-hidden="true">◆</span>
        <div class="item-name" style="color:var(--color-mythic);">Mythic Potion</div>
      </div>
      <div class="item-controls">
        <div class="item-qty" id="qty-mythic">0</div>
        <button class="btn-action" id="btn-mythic">Arm</button>
      </div>
    </div>

    <!-- Tier 3: Rare -->
    <div class="item-row" id="row-rare">
      <div class="item-meta">
        <span class="potion-asset" aria-hidden="true">◈</span>
        <div class="item-name" style="color:var(--color-rare);">Rare Potion</div>
      </div>
      <div class="item-controls">
        <div class="item-qty" id="qty-rare">0</div>
        <button class="btn-action" id="btn-rare">Arm</button>
      </div>
    </div>

    <!-- Tier 2: Uncommon -->
    <div class="item-row" id="row-uncommon">
      <div class="item-meta">
        <span class="potion-asset" aria-hidden="true">●</span>
        <div class="item-name" style="color:var(--color-uncommon);">Uncommon Potion</div>
      </div>
      <div class="item-controls">
        <div class="item-qty" id="qty-uncommon">0</div>
        <button class="btn-action" id="btn-uncommon">Arm</button>
      </div>
    </div>

    <!-- Tier 1: Basic -->
    <div class="item-row" id="row-basic">
      <div class="item-meta">
        <span class="potion-asset" aria-hidden="true">•</span>
        <div class="item-name" style="color:var(--color-basic);">Basic Potion</div>
      </div>
      <div class="item-controls">
        <div class="item-qty" id="qty-basic">0</div>
        <button class="btn-action" id="btn-basic">Arm</button>
      </div>
    </div>
  </div>

  <div id="ticker-tray">Fate awaits your arrival.</div>

  <script src="popup.js"></script>
</body>
</html>
